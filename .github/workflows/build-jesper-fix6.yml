name: Build Jesper FIX6

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Restore Jesper source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p jesper-build/project
          python3 - <<'PY'
          import base64
          import hashlib
          from pathlib import Path

          chunks = sorted(Path('jesper-build/chunks2').glob('part*.txt'))
          if not chunks:
              raise SystemExit('No source chunks found')

          output = bytearray()
          for chunk in chunks:
              encoded = ''.join(chunk.read_text(encoding='ascii').split())
              try:
                  decoded = base64.b64decode(encoded, validate=True)
              except Exception as exc:
                  raise SystemExit(f'Invalid base64 in {chunk}: length={len(encoded)}: {exc}')
              print(f'{chunk}: {len(decoded)} bytes')
              output.extend(decoded)

          archive = Path('jesper-build/Jesper-FIX6-Source.zip')
          archive.write_bytes(output)
          print(f'SHA-256: {hashlib.sha256(output).hexdigest()}')
          PY
          unzip -tq jesper-build/Jesper-FIX6-Source.zip
          unzip -q jesper-build/Jesper-FIX6-Source.zip -d jesper-build/project
          test -f jesper-build/project/Jesper/pom.xml

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: jesper-build/project/Jesper/pom.xml

      - name: Build against official Paper 1.21.11 API
        working-directory: jesper-build/project/Jesper
        run: mvn -B -U clean package

      - name: Verify plugin jar
        shell: bash
        run: |
          set -euo pipefail
          JAR=jesper-build/project/Jesper/target/Jesper.jar
          test -s "$JAR"
          jar tf "$JAR" | grep -q '^plugin.yml$'
          jar tf "$JAR" | grep -q '^org/example1/jesper/Jesper.class$'
          if jar tf "$JAR" | grep -q '^org/bukkit/'; then
            echo 'Bukkit/Paper API classes must not be shaded into the plugin jar.' >&2
            exit 1
          fi
          mkdir -p jesper-build/verify
          cd jesper-build/verify
          jar xf "../../$JAR" plugin.yml
          grep -q "version: '1.21.11-FIX6'" plugin.yml

      - name: Smoke test on Paper 1.21.11 build 132
        shell: bash
        run: |
          set -euo pipefail
          TEST_DIR="$GITHUB_WORKSPACE/jesper-build/smoke"
          USER_AGENT='JesperPluginBuild/1.21.11-FIX6 (didikoral554@gmail.com)'
          mkdir -p "$TEST_DIR/plugins"
          cp "$GITHUB_WORKSPACE/jesper-build/project/Jesper/target/Jesper.jar" "$TEST_DIR/plugins/Jesper.jar"
          cd "$TEST_DIR"

          BUILDS_JSON=$(curl -fsSL -H "User-Agent: $USER_AGENT" "https://fill.papermc.io/v3/projects/paper/versions/1.21.11/builds")
          DOWNLOAD_URL=$(python3 -c 'import json,sys; builds=json.load(sys.stdin); print(next(item["downloads"]["server:default"]["url"] for item in builds if item["downloads"]["server:default"]["name"].endswith("-132.jar")))' <<< "$BUILDS_JSON")
          curl -fsSL -H "User-Agent: $USER_AGENT" -o paper.jar "$DOWNLOAD_URL"

          printf 'eula=true\n' > eula.txt
          java -Xms512M -Xmx1G -jar paper.jar --nogui > console.log 2>&1 &
          SERVER_PID=$!

          cleanup() {
            status=$?
            trap - EXIT
            if [ "$status" -ne 0 ]; then
              echo '----- Paper smoke-test console -----'
              cat console.log || true
              echo '----- End console -----'
            fi
            kill "$SERVER_PID" 2>/dev/null || true
            wait "$SERVER_PID" 2>/dev/null || true
            exit "$status"
          }
          trap cleanup EXIT

          started=0
          for _ in $(seq 1 90); do
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              exit 1
            fi
            if grep -q 'Done (' console.log; then
              started=1
              break
            fi
            sleep 2
          done

          [ "$started" -eq 1 ]
          grep -Fq 'Enabling Jesper v1.21.11-FIX6' console.log
          grep -Fq 'Jesper Premium wurde erfolgreich geladen. Version: 1.21.11-FIX6' console.log

          if grep -E 'Error occurred while enabling Jesper|Could not load.*Jesper|IncompatibleClassChangeError|NoSuchMethodError' console.log; then
            exit 1
          fi

          trap - EXIT
          kill "$SERVER_PID" 2>/dev/null || true
          wait "$SERVER_PID" 2>/dev/null || true

      - name: Upload Jesper.jar
        uses: actions/upload-artifact@v4
        with:
          name: Jesper-FIX6
          path: jesper-build/project/Jesper/target/Jesper.jar
          if-no-files-found: error
          retention-days: 1
